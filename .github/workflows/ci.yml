name: CI
# Syntax check, ShellCheck, a smoke test of the install scripts and a trial build of both packages
# on every PR and push to master. nfpm is pinned (version + SHA256) like in release.yml: bump both together.
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  NFPM_VERSION: "2.49.0"
  NFPM_SHA256: "2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          bash -n scripts/sysstats.sh install.sh uninstall.sh packaging/package.sh tests/smoke.sh
          sh -n sway/desktop-stats-widget.sh packaging/files/postinst.sh \
            packaging/files/sway-desktop-stats-install packaging/files/sway-desktop-stats-uninstall
      - name: ShellCheck
        run: |
          shellcheck scripts/sysstats.sh install.sh uninstall.sh sway/desktop-stats-widget.sh \
            packaging/package.sh packaging/files/postinst.sh packaging/files/sway-desktop-stats-install \
            packaging/files/sway-desktop-stats-uninstall tests/smoke.sh
      - name: VERSION is a plain X.Y.Z
        run: head -1 VERSION | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Smoke test (sysstats, install, uninstall in a throw-away HOME)
        run: bash tests/smoke.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: Build both packages
        run: bash packaging/package.sh "$(head -1 VERSION | tr -d '[:space:]')"
      - name: The packages contain the program and the right dependencies
        run: |
          cd dist/release
          dpkg-deb -c sway-desktop-stats_all.deb | grep -q ' ./usr/bin/sway-desktop-stats-install$'
          dpkg-deb -f sway-desktop-stats_all.deb Depends | grep -q 'waybar'
          tar --zstd -tf sway-desktop-stats-*.pkg.tar.zst | grep -q '^usr/bin/sway-desktop-stats-install$'
          pkginfo=$(tar --zstd -xOf sway-desktop-stats-*.pkg.tar.zst .PKGINFO)
          grep -q '^depend = gawk$' <<< "$pkginfo"
          # nfpm turns suggests into optdepend: they must be Arch names, not Debian ones
          grep -q '^optdepend = docker$' <<< "$pkginfo"
          grep -q '^optdepend = networkmanager$' <<< "$pkginfo"
          ! grep -qE 'docker\.io|network-manager' <<< "$pkginfo"
